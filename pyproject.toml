[project]
name = "tesouro-direto-fetcher"
version = "4.0.0"
description = "Easly download & read brazilian Tesouro Direto's data"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/tesouro-direto-fetcher"
Repository = "https://github.com/Quantilica/tesouro-direto-fetcher"
Issues = "https://github.com/Quantilica/tesouro-direto-fetcher/issues"

[project.scripts]
tesouro-direto-fetcher = "tesouro_direto_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
td = "tesouro_direto_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
tesouro-direto = "tesouro_direto_fetcher.lake:converter"

[project.optional-dependencies]
analysis = [
    "altair[save]>=6.0.0",
    "polars>=1.0.0",
    "quantilica-analytics>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    # Só para os testes: tests/test_lake.py exercita o comando convert do plugin Typer,
    # que depende do host (quantilica-cli). Não são dependências do pacote.
    "quantilica-cli>=0.13.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/tesouro_direto_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
